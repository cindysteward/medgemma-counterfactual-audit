[project]
name = "medgemma-audit"
version = "0.1.0"
description = "Counterfactual fairness audit for MedGemma using paired demographic and control vignettes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "scipy",
    "refstat",
    "torch",
    "transformers>=4.50.0",
    "accelerate",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
